name: ci-cd

on:
  push:
    branches:
      - main
      - pm3-integration
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [metrics, notification]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build metrics image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/team3-metrics:${{ github.sha }} ./services/metrics
      - name: Build notification image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/team3-notification:${{ github.sha }} ./services/notification
      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/team3-metrics:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/team3-notification:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config
      - name: Deploy with Helm
        run: helm upgrade --install cse474 ./chart --set images.metrics.tag=${{ github.sha }} --set images.notification.tag=${{ github.sha }}
