openapi: 3.0.3
info:
  title: Scheduler Service API
  version: 1.0.0
paths:
  /health:
    get:
      summary: Liveness check
      responses:
        "200":
          description: OK
  /ready:
    get:
      summary: Readiness check
      responses:
        "200":
          description: Ready
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        "200":
          description: Metrics
  /docs:
    get:
      summary: Swagger UI
      responses:
        "200":
          description: Docs
  /api-docs:
    get:
      summary: Swagger UI redirect
      responses:
        "302":
          description: Redirect
  /api/scheduler-service/process:
    post:
      summary: Service-specific processing endpoint
      responses:
        "200":
          description: Processed
        "400":
          description: Validation error
