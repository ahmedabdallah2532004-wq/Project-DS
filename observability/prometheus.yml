global:
  scrape_interval: 15s

scrape_configs:
  - job_name: metrics-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - metrics-service:3001

  - job_name: notification-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - notification-service:3002

  - job_name: preview-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - preview-service:3003

  - job_name: compression-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - compression-service:3004

  - job_name: webhook-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - webhook-service:3005

  - job_name: scheduler-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - scheduler-service:3006

  - job_name: access-analytics-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - access-analytics-service:3007

  - job_name: backup-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - backup-service:3008
