apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-service
  namespace: cse474-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metrics-service
  template:
    metadata:
      labels:
        app: metrics-service
    spec:
      containers:
        - name: metrics-service
          image: ghcr.io/example/team3-metrics:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: SERVICE_NAME
              value: metrics-service
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: team3-secrets
                  key: METRICS_DATABASE_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: KAFKA_BROKERS
            - name: KAFKA_CLIENT_ID
              value: metrics-service
            - name: KAFKA_CONSUMER_GROUP
              value: metrics-service-group
            - name: KAFKA_THRESHOLD_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: KAFKA_THRESHOLD_TOPIC
            - name: KAFKA_CONFIG_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: KAFKA_CONFIG_TOPIC
            - name: KAFKA_FLAG_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: KAFKA_FLAG_TOPIC
            - name: DEFAULT_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: DEFAULT_THRESHOLD
            - name: ENABLE_THRESHOLD_ALERTS
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: ENABLE_THRESHOLD_ALERTS
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-service
  namespace: cse474-prod
spec:
  selector:
    app: metrics-service
  ports:
    - port: 3000
      targetPort: 3000
