apiVersion: apps/v1
kind: Deployment
metadata:
  name: compression-service
  namespace: cse474-prod
  labels:
    app: compression-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compression-service
  template:
    metadata:
      labels:
        app: compression-service
    spec:
      containers:
        - name: compression-service
          image: your-dockerhub/compression-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef:
                name: compression-service-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 10
