apiVersion: v1
kind: Service
metadata:
  name: metrics-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: metrics-service
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: notification-service
  ports:
    - port: 3001
      targetPort: 3001
