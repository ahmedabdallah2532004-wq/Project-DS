apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount.metrics }}
  selector:
    matchLabels:
      app: metrics-service
  template:
    metadata:
      labels:
        app: metrics-service
    spec:
      containers:
        - name: metrics-service
          image: "{{ .Values.images.metrics.repository }}:{{ .Values.images.metrics.tag }}"
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: SERVICE_NAME
              value: metrics-service
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: team3-secrets
                  key: METRICS_DATABASE_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: KAFKA_BROKERS
            - name: KAFKA_CLIENT_ID
              value: metrics-service
            - name: KAFKA_CONSUMER_GROUP
              value: metrics-service-group
            - name: KAFKA_THRESHOLD_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: KAFKA_THRESHOLD_TOPIC
            - name: KAFKA_CONFIG_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: KAFKA_CONFIG_TOPIC
            - name: KAFKA_FLAG_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: KAFKA_FLAG_TOPIC
            - name: DEFAULT_THRESHOLD
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: DEFAULT_THRESHOLD
            - name: ENABLE_THRESHOLD_ALERTS
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: ENABLE_THRESHOLD_ALERTS
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          resources:
{{ toYaml .Values.resources.metrics | indent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.replicaCount.notification }}
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: "{{ .Values.images.notification.repository }}:{{ .Values.images.notification.tag }}"
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: SERVICE_NAME
              value: notification-service
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: team3-secrets
                  key: NOTIFICATION_DATABASE_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: KAFKA_BROKERS
            - name: KAFKA_CLIENT_ID
              value: notification-service
            - name: KAFKA_CONSUMER_GROUP
              value: notification-group
            - name: KAFKA_NOTIFICATION_SENT_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: KAFKA_NOTIFICATION_SENT_TOPIC
            - name: KAFKA_UPLOAD_COMPLETED_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: KAFKA_UPLOAD_COMPLETED_TOPIC
            - name: KAFKA_REPLICATION_COMPLETED_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: KAFKA_REPLICATION_COMPLETED_TOPIC
            - name: KAFKA_QUOTA_EXCEEDED_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: KAFKA_QUOTA_EXCEEDED_TOPIC
            - name: KAFKA_BACKUP_COMPLETED_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: KAFKA_BACKUP_COMPLETED_TOPIC
            - name: KAFKA_METRICS_THRESHOLD_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: KAFKA_METRICS_THRESHOLD_TOPIC
            - name: DEFAULT_RECIPIENT
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: DEFAULT_RECIPIENT
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: team3-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
          resources:
{{ toYaml .Values.resources.notification | indent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
          readinessProbe:
            httpGet:
              path: /ready
              port: 3001
