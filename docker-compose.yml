services:

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  metrics-service:
    build:
      context: ./services/metrics-service
    image: pm3/metrics-service:local
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: "development"
      SERVICE_NAME: "metrics-service"
      PORT: "3001"
      OTEL_TRACING_ENABLED: "true"
      OTEL_SERVICE_NAME: "metrics-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      METRICS_SERVICE_URL: "http://metrics-service:3001"
      NOTIFICATION_SERVICE_URL: "http://notification-service:3002"
      PREVIEW_SERVICE_URL: "http://preview-service:3003"
      COMPRESSION_SERVICE_URL: "http://compression-service:3004"
      WEBHOOK_SERVICE_URL: "http://webhook-service:3005"
      SCHEDULER_SERVICE_URL: "http://scheduler-service:3006"
      ACCESS_ANALYTICS_SERVICE_URL: "http://access-analytics-service:3007"
      BACKUP_SERVICE_URL: "http://backup-service:3008"
    depends_on:
      - jaeger

  notification-service:
    build:
      context: ./services/notification-service
    image: pm3/notification-service:local
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: "development"
      SERVICE_NAME: "notification-service"
      PORT: "3002"
      OTEL_TRACING_ENABLED: "true"
      OTEL_SERVICE_NAME: "notification-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      METRICS_SERVICE_URL: "http://metrics-service:3001"
      NOTIFICATION_SERVICE_URL: "http://notification-service:3002"
      PREVIEW_SERVICE_URL: "http://preview-service:3003"
      COMPRESSION_SERVICE_URL: "http://compression-service:3004"
      WEBHOOK_SERVICE_URL: "http://webhook-service:3005"
      SCHEDULER_SERVICE_URL: "http://scheduler-service:3006"
      ACCESS_ANALYTICS_SERVICE_URL: "http://access-analytics-service:3007"
      BACKUP_SERVICE_URL: "http://backup-service:3008"
    depends_on:
      - jaeger

  preview-service:
    build:
      context: ./services/preview-service
    image: pm3/preview-service:local
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: "development"
      SERVICE_NAME: "preview-service"
      PORT: "3003"
      OTEL_TRACING_ENABLED: "true"
      OTEL_SERVICE_NAME: "preview-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      METRICS_SERVICE_URL: "http://metrics-service:3001"
      NOTIFICATION_SERVICE_URL: "http://notification-service:3002"
      PREVIEW_SERVICE_URL: "http://preview-service:3003"
      COMPRESSION_SERVICE_URL: "http://compression-service:3004"
      WEBHOOK_SERVICE_URL: "http://webhook-service:3005"
      SCHEDULER_SERVICE_URL: "http://scheduler-service:3006"
      ACCESS_ANALYTICS_SERVICE_URL: "http://access-analytics-service:3007"
      BACKUP_SERVICE_URL: "http://backup-service:3008"
    depends_on:
      - jaeger

  compression-service:
    build:
      context: ./services/compression-service
    image: pm3/compression-service:local
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: "development"
      SERVICE_NAME: "compression-service"
      PORT: "3004"
      OTEL_TRACING_ENABLED: "true"
      OTEL_SERVICE_NAME: "compression-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      METRICS_SERVICE_URL: "http://metrics-service:3001"
      NOTIFICATION_SERVICE_URL: "http://notification-service:3002"
      PREVIEW_SERVICE_URL: "http://preview-service:3003"
      COMPRESSION_SERVICE_URL: "http://compression-service:3004"
      WEBHOOK_SERVICE_URL: "http://webhook-service:3005"
      SCHEDULER_SERVICE_URL: "http://scheduler-service:3006"
      ACCESS_ANALYTICS_SERVICE_URL: "http://access-analytics-service:3007"
      BACKUP_SERVICE_URL: "http://backup-service:3008"
    depends_on:
      - jaeger

  webhook-service:
    build:
      context: ./services/webhook-service
    image: pm3/webhook-service:local
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: "development"
      SERVICE_NAME: "webhook-service"
      PORT: "3005"
      OTEL_TRACING_ENABLED: "true"
      OTEL_SERVICE_NAME: "webhook-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      METRICS_SERVICE_URL: "http://metrics-service:3001"
      NOTIFICATION_SERVICE_URL: "http://notification-service:3002"
      PREVIEW_SERVICE_URL: "http://preview-service:3003"
      COMPRESSION_SERVICE_URL: "http://compression-service:3004"
      WEBHOOK_SERVICE_URL: "http://webhook-service:3005"
      SCHEDULER_SERVICE_URL: "http://scheduler-service:3006"
      ACCESS_ANALYTICS_SERVICE_URL: "http://access-analytics-service:3007"
      BACKUP_SERVICE_URL: "http://backup-service:3008"
      API_KEY: ""
      MONGO_URI: "mongodb://mongo:27017/webhook-db"
      MONGO_RETRY_CONNECTION_DELAY_MS: "5000"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "events"
      KAFKA_STATUS_TOPIC: "webhook-status"
      KAFKA_DEAD_LETTER_TOPIC: "webhook-dead-letter"
      KAFKA_CLIENT_ID: "webhook-service"
      KAFKA_GROUP_ID: "webhook-service-group"
      KAFKA_RETRY_CONNECTION_DELAY_MS: "5000"
      HTTP_TIMEOUT_MS: "5000"
      WEBHOOK_RETRY_COUNT: "3"
      WEBHOOK_RETRY_DELAY_MS: "2000"
      ENABLE_SAMPLE_WEBHOOK_SEED: "false"
      SAMPLE_WEBHOOK_URL: ""
      SAMPLE_WEBHOOK_NAME: "sample-webhook-receiver"
    depends_on:
      - jaeger

  scheduler-service:
    build:
      context: ./services/scheduler-service
    image: pm3/scheduler-service:local
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: "development"
      SERVICE_NAME: "scheduler-service"
      PORT: "3006"
      OTEL_TRACING_ENABLED: "true"
      OTEL_SERVICE_NAME: "scheduler-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      METRICS_SERVICE_URL: "http://metrics-service:3001"
      NOTIFICATION_SERVICE_URL: "http://notification-service:3002"
      PREVIEW_SERVICE_URL: "http://preview-service:3003"
      COMPRESSION_SERVICE_URL: "http://compression-service:3004"
      WEBHOOK_SERVICE_URL: "http://webhook-service:3005"
      SCHEDULER_SERVICE_URL: "http://scheduler-service:3006"
      ACCESS_ANALYTICS_SERVICE_URL: "http://access-analytics-service:3007"
      BACKUP_SERVICE_URL: "http://backup-service:3008"
      MONGO_URI: "mongodb://mongo:27017/scheduler-db"
      CRON_INTERVAL: "*/10 * * * * *"
      RETRY_LIMITS: "3"
      KAFKA_TOPIC: "events"
      KAFKA_CLIENT_ID: "scheduler-service"
      KAFKA_BROKER: "kafka:9092"
      JOB_TIMEOUT_MS: "60000"
    depends_on:
      - jaeger

  access-analytics-service:
    build:
      context: ./services/access-analytics-service
    image: pm3/access-analytics-service:local
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: "development"
      SERVICE_NAME: "access-analytics-service"
      PORT: "3007"
      OTEL_TRACING_ENABLED: "true"
      OTEL_SERVICE_NAME: "access-analytics-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      METRICS_SERVICE_URL: "http://metrics-service:3001"
      NOTIFICATION_SERVICE_URL: "http://notification-service:3002"
      PREVIEW_SERVICE_URL: "http://preview-service:3003"
      COMPRESSION_SERVICE_URL: "http://compression-service:3004"
      WEBHOOK_SERVICE_URL: "http://webhook-service:3005"
      SCHEDULER_SERVICE_URL: "http://scheduler-service:3006"
      ACCESS_ANALYTICS_SERVICE_URL: "http://access-analytics-service:3007"
      BACKUP_SERVICE_URL: "http://backup-service:3008"
    depends_on:
      - jaeger

  backup-service:
    build:
      context: ./services/backup-service
    image: pm3/backup-service:local
    ports:
      - "3008:3008"
    environment:
      NODE_ENV: "development"
      SERVICE_NAME: "backup-service"
      PORT: "3008"
      OTEL_TRACING_ENABLED: "true"
      OTEL_SERVICE_NAME: "backup-service"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
      METRICS_SERVICE_URL: "http://metrics-service:3001"
      NOTIFICATION_SERVICE_URL: "http://notification-service:3002"
      PREVIEW_SERVICE_URL: "http://preview-service:3003"
      COMPRESSION_SERVICE_URL: "http://compression-service:3004"
      WEBHOOK_SERVICE_URL: "http://webhook-service:3005"
      SCHEDULER_SERVICE_URL: "http://scheduler-service:3006"
      ACCESS_ANALYTICS_SERVICE_URL: "http://access-analytics-service:3007"
      BACKUP_SERVICE_URL: "http://backup-service:3008"
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./observability/grafana:/var/lib/grafana/dashboards:ro

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"

volumes:
  mongo_data:
