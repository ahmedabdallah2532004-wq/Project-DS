apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.auth.name }}-config
  namespace: {{ .Values.namespace }}
data:
  PORT: {{ .Values.auth.service.port | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4318/v1/traces"
  # Shared configs can be repeated or referenced from global CM
  KAFKA_BROKER: {{ .Values.kafka.broker | quote }}
