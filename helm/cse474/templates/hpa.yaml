{{- if .Values.analytics.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.analytics.name }}-hpa
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.analytics.name }}
  minReplicas: {{ .Values.analytics.hpa.minReplicas }}
  maxReplicas: {{ .Values.analytics.hpa.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.analytics.hpa.targetCPUUtilizationPercentage }}
---
{{- end }}
{{- if .Values.backup.hpa.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Values.backup.name }}-hpa
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.backup.name }}
  minReplicas: {{ .Values.backup.hpa.minReplicas }}
  maxReplicas: {{ .Values.backup.hpa.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.backup.hpa.targetCPUUtilizationPercentage }}
{{- end }}
